<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <title>Frontend Mentor | NFT preview card component</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <article class="card__container">
        <div class="card__image">
          <img
            src="./images/image-equilibrium.jpg"
            alt="Equilibrium #3429 NFT artwork"
          />
          <div class="overlay__image">
            <img src="./images/icon-view.svg" alt="" />
          </div>
        </div>
        <div class="card__content">
          <h1 class="card__title">Equilibrium #3429</h1>
          <div class="card__description">
            <p>Our Equilibrium collection promotes balance and calm.</p>
          </div>
          <div class="card__tags">
            <div class="tag__left">
              <img src="./images/icon-ethereum.svg" alt="" />
              <span>0.041 ETH</span>
            </div>
            <div class="tag__right">
              <img src="./images/icon-clock.svg" alt="" />
              <span>3 days left</span>
            </div>
          </div>
        </div>
        <div class="card__divisor"></div>
        <div class="card__bottom">
          <img src="./images/image-avatar.png" alt="" />
          <span>Creation of <a href="#">Jules Wyvern</a></span>
        </div>
      </article>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by
      <a href="https://github.com/nicolascorera" target="_blank" rel="noopener"
        >Nicolás Corera</a
      >.
    </footer>
  </body>
</html>
